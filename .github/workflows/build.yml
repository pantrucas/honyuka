name: Build APK

on:
  push:
    branches: [master, main, mejoras]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "HONYUKA_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - APK will be signed with a throwaway debug key (updates won't install over it)."
          fi

      - name: Build release APK
        env:
          HONYUKA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          HONYUKA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HONYUKA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p dist
          cp "$(find build/outputs/apk/release -name '*.apk' | head -n 1)" dist/Globito.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Globito
          path: dist/Globito.apk

      - name: Move the "latest" tag to this commit
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Globito (última versión)
          prerelease: true
          body: |
            Built automatically from ${{ github.ref_name }} @ ${{ github.sha }}.
            Download **Globito.apk** below.
          files: dist/Globito.apk
