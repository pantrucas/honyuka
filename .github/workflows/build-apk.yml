name: Build debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradlew is committed without the executable bit.
      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build the debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: List the build outputs
        run: ls -lR build/outputs/apk

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: honyuka-debug-apk
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload the unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
